apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../llama-stack
  - ../../../mcp-servers/ntfy
  - ../../../ui

namespace: blackjack-ai-demo

labels:
  - pairs:
      app.kubernetes.io/name: blackjack-ai-game
      app.kubernetes.io/instance: vllm-demo
      app.kubernetes.io/component: ai-gaming-demo
      deployment.mode: vllm

replacements:
- source:
    kind: ConfigMap
    name: run-config-vllm
  targets:
  - select:
      kind: Deployment
      name: llamastack-deployment
    fieldPaths:
    - spec.template.spec.volumes.[name=run-config-volume].configMap.name

configMapGenerator:
- name: blackjack-config
  literals:
    - VITE_USE_LOCAL_AI=false
    - VITE_AI_PROVIDER=vllm
    - VITE_LLAMA_STACK_ENDPOINT=http://llamastack-service:8321
  behavior: replace

secretGenerator:
- name: blackjack-secrets
  literals:
    - VLLM_API_TOKEN=fake
  behavior: replace

patchesStrategicMerge:
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: llamastack-deployment
  spec:
    template:
      spec:
        containers:
        - name: llamastack
          env:
          - name: VLLM_URL
            value: "https://llama-3-2-3b-maas-apicast-production.apps.prod.rhoai.rh-aiservices-bu.com:443/v1"
          - name: VLLM_API_TOKEN
            valueFrom:
              secretKeyRef:
                name: blackjack-secrets
                key: VLLM_API_TOKEN

images:
- name: quay.io/redhat-et/llama
  newTag: vllm-0.2.2
