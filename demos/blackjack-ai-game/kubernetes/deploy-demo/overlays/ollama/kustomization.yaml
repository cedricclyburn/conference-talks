apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../llama-stack
  - ../../../ui

namespace: blackjack-ai-demo

labels:
  - pairs:
      app.kubernetes.io/name: blackjack-ai-game
      app.kubernetes.io/instance: ollama-demo
      app.kubernetes.io/component: ai-gaming-demo
      deployment.mode: ollama

replacements:
- source:
    kind: ConfigMap
    name: run-config-ollama
  targets:
  - select:
      kind: Deployment
      name: llamastack-deployment
    fieldPaths:
    - spec.template.spec.volumes.[name=run-config-volume].configMap.name

configMapGenerator:
- name: blackjack-config
  literals:
    - VITE_USE_LOCAL_AI=true
    - VITE_AI_PROVIDER=ollama
    - VITE_LLAMA_STACK_ENDPOINT=http://llamastack-service:8321
  behavior: replace

secretGenerator:
- name: blackjack-secrets
  literals:
    - OLLAMA_API_TOKEN=fake
  behavior: replace

patchesStrategicMerge:
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: llamastack-deployment
  spec:
    template:
      spec:
        containers:
        - name: llamastack
          env:
          - name: OLLAMA_URL
            value: "http://ramalama-service:11434"
          - name: RAMALAMA_MODEL
            value: "llama3.2:1b"

images:
- name: quay.io/redhat-et/llama
  newTag: vllm-0.2.2
