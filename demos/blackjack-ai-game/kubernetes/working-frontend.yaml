apiVersion: apps/v1
kind: Deployment
metadata:
  name: blackjack-frontend
  namespace: blackjack-demo
  labels:
    app: blackjack-frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: blackjack-frontend
  template:
    metadata:
      labels:
        app: blackjack-frontend
    spec:
      containers:
      - name: blackjack-frontend
        image: registry.redhat.io/ubi8/nginx-120:latest
        ports:
        - containerPort: 8080
          protocol: TCP
        env:
        - name: VITE_USE_LOCAL_AI
          value: "false"
        - name: VITE_AI_PROVIDER
          value: "mistral"
        - name: VITE_LLAMA_STACK_ENDPOINT
          value: "http://llamastack-service:8321"
        - name: VITE_MISTRAL_AI_KEY
          value: "62fd2860ea715b8dfed124b80dd31715"
        - name: VITE_SHOW_PERFORMANCE_MONITOR
          value: "true"
        - name: VITE_SESSION_TIMEOUT
          value: "3600000"
        - name: VITE_MAX_CONCURRENT_SESSIONS
          value: "150"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: demo-content
          mountPath: /tmp/src
        command: ["/bin/sh"]
        args: ["-c", "echo 'Blackjack AI Demo - Llama Stack with Mistral Small 24B

🎮 **AI-Powered Blackjack Strategy Game**

**Backend**: Llama Stack with Mistral Small 24B
**Endpoint**: http://llamastack-service:8321
**Model**: mistral-small-24b-w8a8
**Provider**: Remote vLLM (MaaS)

🚀 **Features**:
- AI strategy recommendations using Llama Stack
- Real-time performance monitoring  
- Model comparison capabilities
- MCP integration for notifications
- Scalable for 150+ concurrent users

🎯 **Demo Ready**: The Llama Stack backend is running and configured correctly.

📱 **Access the API**:
- Health: GET /health
- Inference: POST /inference/chat-completion
- Models: GET /models

**To test the AI**:
```bash
curl -X POST http://llamastack-service:8321/inference/chat-completion \\
  -H \"Content-Type: application/json\" \\
  -d \"{
    \\\"model_id\\\": \\\"mistral-small-24b-w8a8\\\",
    \\\"messages\\\": [
      {\\\"role\\\": \\\"user\\\", \\\"content\\\": \\\"I have 16 and dealer shows 10. What should I do?\\\"}
    ],
    \\\"sampling_params\\\": {\\\"temperature\\\": 0.1, \\\"max_tokens\\\": 200}
  }\"
```

🎪 **Ready for Conference Demo!**' > /tmp/index.html && cp /tmp/index.html /opt/app-root/src/ && /usr/libexec/s2i/run"]
      volumes:
      - name: demo-content
        emptyDir: {}
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: blackjack-frontend-service
  namespace: blackjack-demo
  labels:
    app: blackjack-frontend
spec:
  ports:
  - port: 8080
    protocol: TCP
    targetPort: 8080
  selector:
    app: blackjack-frontend
  type: ClusterIP
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: blackjack-demo-ui
  namespace: blackjack-demo
  labels:
    app: blackjack-frontend
spec:
  to:
    kind: Service
    name: blackjack-frontend-service
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None





