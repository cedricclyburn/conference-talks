apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: blackjack-ui
  labels:
    app.kubernetes.io/name: blackjack-ai-game
    app.kubernetes.io/component: ui
spec:
  to:
    kind: Service
    name: frontend-service
    weight: 100
  port:
    targetPort: 8080
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  wildcardPolicy: None
