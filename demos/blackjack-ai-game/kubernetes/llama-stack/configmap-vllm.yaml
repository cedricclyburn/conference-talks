apiVersion: v1
kind: ConfigMap
metadata:
  name: run-config-vllm
data:
  config.yaml: |
    version: '2'
    image_name: blackjack-vllm
    apis:
    - agents
    - datasetio
    - eval
    - inference
    - safety
    - scoring
    - telemetry
    - tool_runtime
    - vector_io
    providers:
      inference:
      - provider_id: vllm-remote
        provider_type: remote::vllm
        config:
          url: ${env.VLLM_URL:=https://llama-3-2-3b-maas-apicast-production.apps.prod.rhoai.rh-aiservices-bu.com:443/v1}
          max_tokens: 4096
          api_token: ${env.VLLM_API_TOKEN:=fake}
          tls_verify: true
      - provider_id: sentence-transformers
        provider_type: inline::sentence-transformers
        config: {}
      agents:
      - provider_id: meta-reference
        provider_type: inline::meta-reference
        config:
          persistence_store:
            type: sqlite
            namespace: null
            db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/blackjack-vllm}/agents_store.db
      eval:
      - provider_id: meta-reference
        provider_type: inline::meta-reference
        config:
          kvstore:
            type: sqlite
            namespace: null
            db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/blackjack-vllm}/meta_reference_eval.db
      datasetio:
      - provider_id: localfs
        provider_type: inline::localfs
        config:
          kvstore:
            type: sqlite
            namespace: null
            db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/blackjack-vllm}/localfs_datasetio.db
      scoring:
      - provider_id: basic
        provider_type: inline::basic
        config: {}
      - provider_id: llm-as-judge
        provider_type: inline::llm-as-judge
        config: {}
      telemetry:
      - provider_id: meta-reference
        provider_type: inline::meta-reference
        config:
          service_name: ${env.OTEL_SERVICE_NAME:llama-stack-blackjack}
          sinks: ${env.TELEMETRY_SINKS:console,sqlite}
          sqlite_db_path: ${env.SQLITE_DB_PATH:~/.llama/distributions/blackjack-vllm/trace_store.db}
      tool_runtime:
      - provider_id: model-context-protocol
        provider_type: remote::model-context-protocol
        config: {}
    metadata_store:
      type: sqlite
      db_path: ${env.SQLITE_STORE_DIR:~/.llama/distributions/blackjack-vllm}/registry.db
    models:
    - metadata: {}
      model_id: llama-3-2-3b
      provider_id: vllm-remote
      model_type: llm
    - metadata:
        embedding_dimension: 384
      model_id: all-MiniLM-L6-v2
      provider_id: sentence-transformers
      model_type: embedding
    # MCP integration for ntfy notifications
    tool_groups:
    - toolgroup_id: mcp::ntfy
      provider_id: model-context-protocol
      mcp_endpoint:
        uri: "http://ntfy-mcp-service:8000/sse"
